<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://generativelanguage.googleapis.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>סיור מכרז – צילום ובדיקה</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#17222c;--mut:#5f6f7c;--pri:#0b3d5c;--pri2:#136d9f;--acc:#1f8fd0;--ok:#1b7f3b;--bad:#c62828;--warn:#b26a00;--info:#1a5fb4;--line:#dfe6ec;--r:16px;--sh:0 1px 2px rgba(16,40,60,.06),0 4px 16px rgba(16,40,60,.08);--sh2:0 8px 28px rgba(11,61,92,.22);--grad:linear-gradient(135deg,#0b3d5c 0%,#145a86 55%,#1f8fd0 125%)}
:root[data-theme="dark"]{--bg:#0a0e12;--card:#161f27;--ink:#eef3f7;--mut:#a7b7c4;--pri:#0b3d5c;--pri2:#2b86bf;--acc:#49b4ef;--ok:#49c06c;--bad:#ef5a50;--warn:#e0a53a;--info:#4a9be8;--line:#263440;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);--sh2:0 8px 28px rgba(0,0,0,.55);--grad:linear-gradient(135deg,#0b2d44 0%,#124663 60%,#1f6f9e 125%)}
:root[data-theme="dark"] .ph{background:#0f171e}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#0f171e;color:var(--ink)}
:root[data-theme="dark"] button.btn.sec,:root[data-theme="dark"] label.btn.sec{background:#223240;color:#dfeaf2}
:root[data-theme="dark"] #modal .sheet{background:#161f27}
:root[data-theme="dark"] nav,:root[data-theme="dark"] .tbar{background:#121a21}
:root[data-theme="contrast"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#111;--pri:#000;--pri2:#003a8c;--acc:#003a8c;--ok:#006b25;--bad:#b00000;--warn:#7a4a00;--info:#003a8c;--line:#000;--sh:0 0 0 1px #000;--sh2:0 0 0 2px #000;--grad:#000}
:root[data-theme="contrast"] body{font-weight:600}
:root[data-theme="contrast"] .chip{color:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:5;min-height:56px;background:var(--grad);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
header .t{font-weight:800;font-size:19px;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sub{font-size:13px;opacity:.97;white-space:nowrap;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px}
header button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:12px;min-width:46px;min-height:44px;font-size:19px;transition:transform .08s,background .15s}
header button:active{transform:scale(.92);background:rgba(255,255,255,.26)}
.tbar{position:sticky;top:56px;z-index:4;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbar .seg{flex:1}
main{padding:12px 14px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom);box-shadow:0 -2px 14px rgba(16,40,60,.08)}
nav button{flex:1;min-height:62px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--mut);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border-radius:14px;transition:color .15s,background .15s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button.on{color:var(--pri2);background:color-mix(in srgb,var(--pri2) 13%,transparent)}
nav button.on svg{stroke-width:2.3}
nav .b{position:absolute;top:5px;inset-inline-start:54%;background:var(--bad);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;font-weight:800;padding:0 4px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--sh)}
.card[data-act]{transition:transform .08s,box-shadow .15s}
.card[data-act]:active{transform:scale(.985);box-shadow:var(--sh2)}
h2{font-size:14px;font-weight:800;letter-spacing:.03em;margin:18px 4px 6px;color:var(--mut)}
h3{font-size:17px;font-weight:700;margin:0 0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mut{color:var(--mut);font-size:14px}
button.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;border:0;background:var(--pri2);color:#fff;font-size:17px;font-weight:700;box-shadow:0 2px 10px rgba(19,109,159,.28);transition:transform .08s,filter .15s}
button.btn:active,label.btn:active{transform:scale(.97);filter:brightness(.96)}
button.btn.sec,label.btn.sec{background:color-mix(in srgb,var(--pri2) 12%,var(--card));color:var(--pri2);box-shadow:none;border:1px solid var(--line)}
button.btn.bad{background:var(--bad);box-shadow:0 2px 10px rgba(198,40,40,.3)}
button.btn.sm{min-height:42px;font-size:14px;font-weight:600;padding:0 14px;border-radius:11px}
button.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#fff;background:#6b7a86}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9)}
.chip.ok{background:var(--ok)}.chip.retake{background:var(--bad)}.chip.needs_review{background:var(--warn)}.chip.captured{background:var(--info)}.chip.skipped_with_reason{background:#6b7a86}.chip.pending{background:#9aa7b2}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 0 2px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.pill.b{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.pill.w{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-height:50px;font-size:17px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
textarea{min-height:92px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ph{width:calc(50% - 5px);border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--card);box-shadow:var(--sh)}
.ph img{width:100%;height:120px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.seg{display:flex;gap:4px;flex-wrap:nowrap;background:color-mix(in srgb,var(--mut) 12%,transparent);padding:4px;border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--pri2);box-shadow:var(--sh)}
.ring{--p:0;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),color-mix(in srgb,var(--mut) 20%,transparent) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring>span{width:48px;height:48px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:20;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
#modal.show{display:flex}
#modal .sheet{background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:760px;margin:0 auto;max-height:92vh;overflow:auto;box-shadow:var(--sh2)}
#toast{position:fixed;bottom:92px;left:12px;right:12px;z-index:30;background:#14212b;color:#fff;padding:13px 16px;border-radius:14px;display:none;text-align:center;box-shadow:var(--sh2);font-weight:600;max-width:736px;margin:0 auto}
.bar{height:10px;background:color-mix(in srgb,var(--mut) 18%,transparent);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#35b05f);border-radius:999px;transition:width .4s}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--card));color:var(--warn);border-radius:14px;padding:12px;margin:10px 0}
.errbox{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--card));color:var(--bad);border-radius:14px;padding:12px;margin:10px 0}
.okbox{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 42%,var(--card));color:var(--ok);border-radius:14px;padding:12px;margin:10px 0}
canvas.pin{width:100%;touch-action:none}
.sheetimg{position:relative;width:100%}.sheetimg img{width:100%;display:block;border-radius:12px}
.dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--bad);border:3px solid #fff;box-shadow:var(--sh)}
.dot.d2{background:var(--info)}
ul.tight{margin:6px 0;padding-inline-start:20px}ul.tight li{margin:3px 0}
#selftest table{width:100%;border-collapse:collapse;font-size:14px}#selftest td,#selftest th{border:1px solid var(--line);padding:4px}
</style>

<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="vid" accept="video/*" capture="environment" hidden>
<input type="file" id="packfile" accept="application/json,.json" hidden>
<script src="jszip.min.js"></script>
<script src="qrcode.js"></script>
<script>
'use strict';
/* =====================================================================
   Tender Tour Capture - v1.0.0 - single user, Hebrew RTL, offline first.
   Photos stay on the phone. The only network call to a third party is the
   Gemini request the user enables with the paid-tier tick.
   ===================================================================== */
const APP_VERSION = '1.1.0-dev';
const GEMINI_HOST = 'https://generativelanguage.googleapis.com';
const DEFAULTS = {
  model: 'gemini-3.8-flash',            // stable id recommended by Google for new projects (image-capable), verified 20.10.2026; confirm access in AI Studio
  apiBase: GEMINI_HOST,
  paid: false, key: '',
  blurMin: 35, lumaMin: 45, lumaMax: 215,
  tolPct: 2, aiMax: 1600, aiDailyMax: 200, lowSpaceGB: 1,
  theme: 'light',
  pin: ''
};
const REASONS = {
  NOT_TAKEN: 'לא צולם / חסרות תמונות', BLURRY: 'מטושטש', TOO_DARK: 'כהה מדי', TOO_BRIGHT: 'בהיר מדי / סנוור',
  WRONG_SUBJECT: 'נושא שגוי / חסום / רחוק / קרוב מדי', REQUIRED_ELEMENT_MISSING: 'חסר רכיב נדרש בתמונה',
  SCALE_OBJECT_MISSING: 'אין עצם מידה בתמונה', NO_GPS: 'אין מיקום GPS', NO_STANDING_POINT: 'לא סומנה נקודת עמידה',
  DUPLICATE: 'תמונה כפולה', UPLOAD_FAILED: 'שליחה ל-AI נכשלה (רשת)', CHECK_FAILED: 'בדיקת AI נכשלה (תשובה לא תקינה)',
  STORAGE_LOW: 'מקום פנוי נמוך בטלפון', DOC_MISSING: 'מסמך חסר', QUESTION_UNANSWERED: 'שאלה ללא תשובה',
  MEASURE_UNVERIFIED: 'מדידה לא מאומתת', WALK_VIDEO_MISSING: 'אין סרטון סיור לאזור'
};
const ISSUE_MAP = { blurry: 'BLURRY', dark: 'TOO_DARK', bright: 'TOO_BRIGHT', glare: 'TOO_BRIGHT', obstructed: 'WRONG_SUBJECT', too_far: 'WRONG_SUBJECT', too_close: 'WRONG_SUBJECT', wrong_subject: 'WRONG_SUBJECT' };
const STATUS_HE = { pending: 'ממתין', captured: 'צולם', ok: 'תקין', retake: 'לצלם שוב', needs_review: 'לבדיקה', skipped_with_reason: 'דולג' };

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nowIso = () => new Date().toISOString();
const hhmmss = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); };
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms); }
/* ---------- GPS display helpers (offline-safe; no third-party app needed) ---------- */
function mapHref(g) { const la = (+g.lat).toFixed(6), lo = (+g.lon).toFixed(6); return 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo; }
function mapHttp(g) { const la = (+g.lat).toFixed(6), lo = (+g.lon).toFixed(6); return 'https://www.google.com/maps?q=' + la + ',' + lo; }
function gpsLineHtml(g) {
  if (!g) return '<div class="mut"><span class="pill b">אין GPS</span></div>';
  const acc = Math.round(g.accuracy_m);
  return '<div class="mut">📍 <bdi dir="ltr">' + (+g.lat).toFixed(5) + ', ' + (+g.lon).toFixed(5) + '</bdi> ' +
    '<span class="pill' + (acc > 30 ? ' w' : '') + '">±<bdi>' + acc + '</bdi>מ׳</span> ' +
    '<a class="pill" href="' + esc(mapHref(g)) + '" target="_blank" rel="noopener">מפה</a></div>';
}
function showModal(html, onMount) { $('#sheet').innerHTML = html; $('#modal').classList.add('show'); if (onMount) onMount($('#sheet')); }
function hideModal() { $('#modal').classList.remove('show'); $('#sheet').innerHTML = ''; }

/* ---------- IndexedDB ---------- */
const STORES = ['kv', 'packs', 'photos', 'media', 'records', 'log'];
let db;
function openDB(name = 'ttc') {
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbPut = (s, v) => rq(store(s, 'readwrite').put(v));
const dbGet = (s, id) => rq(store(s).get(id));
const dbAll = (s) => rq(store(s).getAll());
const dbDel = (s, id) => rq(store(s, 'readwrite').delete(id));
const dbClear = (s) => rq(store(s, 'readwrite').clear());

/* ---------- state ---------- */
const S = {
  tid: null, pack: null, photos: [], rec: {}, media: [], settings: { ...DEFAULTS },
  tab: 'shots', shotId: null, storageFree: null, capTarget: null, exportParts: null, busy: false, online: true,
  persisted: null, lastBackup: null, honestyDismissed: false, shotFilter: 'all'
};
function applyTheme() { const t = (S.settings && S.settings.theme) || 'light'; document.documentElement.setAttribute('data-theme', t); }
function backupAgeText() {
  const b = S.lastBackup; if (!b || !b.at) return { txt: 'עדיין לא הוכן קובץ תוצאות (גיבוי)', warn: true };
  const h = (Date.now() - new Date(b.at).getTime()) / 3.6e6;
  const t = h < 1 ? 'לפני פחות משעה' : 'לפני ' + Math.round(h) + ' שעות';
  return { txt: 'גיבוי אחרון: ' + t, warn: h > 24 };
}
async function getSettings() { const v = await dbGet('kv', 'settings'); S.settings = { ...DEFAULTS, ...(v || {}) }; delete S.settings.id; return S.settings; }
async function saveSettings(patch) { Object.assign(S.settings, patch); await dbPut('kv', { id: 'settings', ...S.settings }); }
async function log(type, data) {
  const clean = JSON.parse(JSON.stringify(data || {}, (k, v) => (/key|token|secret|pin/i.test(k) ? undefined : v)));
  try { await dbPut('log', { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), t: nowIso(), tid: S.tid, type, data: clean }); } catch (e) { /* never block the user */ }
}
const recKey = (type, id) => type + ':' + id;
async function saveRec(type, id, patch) {
  const k = recKey(type, id); S.rec[k] = { ...(S.rec[k] || {}), ...patch };
  await dbPut('records', { id: S.tid + ':' + k, tid: S.tid, k, v: S.rec[k] });
}
async function loadTender(tid) {
  S.tid = tid; const p = await dbGet('packs', tid); S.pack = p ? p.pack : null;
  S.photos = (await dbAll('photos')).filter((x) => x.tid === tid).sort((a, b) => a.takenAt.localeCompare(b.takenAt));
  S.rec = {}; for (const r of await dbAll('records')) if (r.tid === tid) S.rec[r.k] = r.v;
  S.media = (await dbAll('media')).filter((x) => x.tid === tid);
  await dbPut('kv', { id: 'current', tid });
}

/* ---------- pack validation ---------- */
function validatePack(p) {
  const e = [];
  if (!p || typeof p !== 'object') return ['הקובץ אינו JSON תקין'];
  if (p.pack_version !== 1) e.push('pack_version חייב להיות 1');
  if (!p.tender || !p.tender.id || !p.tender.name) e.push('חסר tender.id או tender.name');
  for (const k of ['zones', 'shots', 'measurements', 'documents', 'questions']) if (!Array.isArray(p[k])) e.push('חסר מערך ' + k);
  const ids = new Set();
  (p.shots || []).forEach((s, i) => {
    if (!s.id || !s.title_he) e.push('shots[' + i + '] חסר id או title_he');
    if (ids.has(s.id)) e.push('מזהה כפול: ' + s.id); ids.add(s.id);
    if (!Array.isArray(s.required_elements)) e.push('shots[' + i + '] חסר required_elements');
  });
  return e;
}

/* ---------- local quality (no AI, no network) ---------- */
async function loadBitmap(blob) {
  try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e1) {
    try { return await createImageBitmap(blob, { resizeWidth: 1600, resizeQuality: 'low' }); } catch (e2) { throw new Error('decode'); }
  }
}
function drawScaled(img, longSide) {
  const w0 = img.width, h0 = img.height, k = Math.min(1, longSide / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
  c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0, c.width, c.height); return c;
}
async function analyzeLocal(blob, st = S.settings) {
  let img; try { img = await loadBitmap(blob); } catch (e) { return { blur: null, luma: null, clip: null, verdict: 'unknown', reasons: [], ahash: null, thumb: null }; }
  const c = drawScaled(img, 800), w = c.width, h = c.height;
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h); let sum = 0, lo = 0, hi = 0;
  for (let i = 0, j = 0; i < g.length; i++, j += 4) { const v = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2]; g[i] = v; sum += v; if (v < 8) lo++; else if (v > 247) hi++; }
  const luma = sum / g.length; let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { const i = y * w + x; const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w]; s += l; s2 += l * l; n++; }
  const blur = n ? s2 / n - (s / n) * (s / n) : 0, clip = (lo + hi) / g.length;
